<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyperwash Detailing — Φόρμα Ολοκλήρωσης Εργασιών</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#172033;--muted:#667085;--line:#e5e7eb;--bg:#f6f7f9;--blue:#315efb;--green:#159570;--amber:#a15c00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif;padding:28px 16px}.wrap{max-width:1000px;margin:auto}header{margin:0 0 24px}h1{font-size:25px;margin:0 0 5px;letter-spacing:-.5px}header p{color:var(--muted);margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #1720330a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label,.colhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted)}input,.time-wheel{font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-width:0}input:focus,.time-wheel:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #315efb18}.progress{height:7px;background:#edf0f3;border-radius:99px;margin-top:18px;overflow:hidden}.fill{height:100%;background:var(--green);width:0;transition:.25s}.section{font-weight:700;font-size:16px;margin-bottom:12px;padding-top:6px;border-top:2px solid var(--line)}.section:first-of-type{border:none;padding:0}.task-wrapper{margin-bottom:16px}.task-header{display:grid;grid-template-columns:42px minmax(180px,1fr) 140px 120px 90px;gap:12px;align-items:center;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}.task-header:hover{background:#f5f7fa}.check{width:30px;height:30px;cursor:pointer;accent-color:var(--green)}.name{font-weight:500}.status{text-align:center;border-radius:6px;padding:6px 5px;font-size:11px;font-weight:700;text-transform:uppercase;white-space:nowrap}.pending{background:#fff3d6;color:var(--amber)}.complete{background:#dff7ee;color:#087653}.excluded{background:#f0f0f0;color:var(--muted)}.task-fields{display:grid;grid-template-columns:minmax(200px,1fr) 120px;gap:12px;padding:8px 12px;background:#fafbfc;border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;margin-bottom:4px}.field-row{display:flex;flex-direction:column;gap:4px}.field-row label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted)}.field-row input,.field-row textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0}.time-wheel{width:100%;padding:6px}.note-field{grid-column:1/-1;margin-top:4px}.note-field textarea{resize:vertical;min-height:50px;font-family:inherit;font-size:12px}.not-included-btn{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;text-transform:uppercase;transition:.15s}.not-included-btn.active{background:var(--amber);color:#fff;border-color:var(--amber)}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{border:0;border-radius:8px;padding:11px 16px;font:600 13px Inter;cursor:pointer}.save{background:var(--ink);color:#fff}.reset{background:#fff;border:1px solid var(--line)!important;color:var(--ink)}.export{background:var(--green);color:#fff;flex:1;min-width:220px}.note{text-align:center;color:var(--muted);font-size:12px;margin:18px 0}.task-wrapper.excluded .name{text-decoration:line-through;color:var(--muted)}.excluded-badge{background:var(--amber);color:#fff;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.task-header{grid-template-columns:38px 1fr 80px}.task-fields{grid-template-columns:1fr;gap:8px}.actions{flex-direction:column}.actions button{width:100%}}
</style>
</head>
<body><main class="wrap">
<header><h1>Hyperwash Detailing</h1><p>Φόρμα Ολοκλήρωσης Εργασιών</p></header>
<section class="card"><div class="grid">
<div class="field"><label>Όνομα Πελάτη</label><input id="customerName" placeholder="Όνομα"></div>
<div class="field"><label>Μάρκα Αυτοκινήτου</label><input id="vehicleMake" placeholder="π.χ. Toyota"></div>
<div class="field"><label>Μοντέλο Αυτοκινήτου</label><input id="vehicleModel" placeholder="π.χ. Camry"></div>
<div class="field"><label>Αριθμός Πινακίδας</label><input id="licensePlate" placeholder="ΑΒΓ 1234"></div>
<div class="field"><label>Ημερομηνία Εργασίας</label><input id="serviceDate" type="date"></div>
<div class="field"><label>Εγκρίθηκε Από</label><input id="approvedBy" placeholder="Όνομα Διευθυντή"></div>
</div><div class="progress"><div class="fill" id="fill"></div></div></section>
<section class="card"><div id="tasks"></div></section>
<div class="actions"><button class="save" onclick="saveLocal()">Αποθήκευση</button><button class="reset" onclick="resetForm()">Επαναφορά</button><button class="export" onclick="exportSheets()">Εξαγωγή σε Google Sheets</button></div>
<p class="note">Τα δεδομένα αποθηκεύονται μόνο σε αυτό το πρόγραμμα περιήγησης. Η εξαγωγή λαμβάνει ένα αρχείο CSV έτοιμο να εισαχθεί στο Google Sheets.</p>
</main>
<script>
const taskGroups={"Εξωτερικές Εργασίες & Βαφή":['Αφαίρεση Γρατσουνιών','Γυάλισμα','Λούστρα Αυτοκινήτου','Κεραμικές Επιστρώσεις','Αφαίρεση Επικαθημάτων'],"Εσωτερικές Εργασίες & Λεπτομέρειες":['Σκούπισμα Καθισμάτων & Χαλιών','Σκούπισμα','Αυτοδιακόσμηση','Βιολογικοί Καθαρισμοί','Καθορισμός Αυτοκινήτου & Μηχανής με Ατμό']};
const root=document.getElementById('tasks');const refs=[];
for(const [group,names] of Object.entries(taskGroups)){const section=document.createElement('div');section.className='section';section.textContent=group;root.appendChild(section);for(const name of names){const wrapper=document.createElement('div');wrapper.className='task-wrapper';const header=document.createElement('div');header.className='task-header';header.innerHTML='<input class="check" type="checkbox"><div class="name"></div><button class="not-included-btn">Δεν Περιλαμβάνεται</button><div class="status pending">Εκκρεμές</div>';header.querySelector('.name').textContent=name;const checkbox=header.querySelector('.check');checkbox.dataset.task=name;checkbox.addEventListener('change',update);const notIncludedBtn=header.querySelector('.not-included-btn');notIncludedBtn.addEventListener('click',(e)=>{e.preventDefault();wrapper.classList.toggle('excluded');notIncludedBtn.classList.toggle('active');update()});const fields=document.createElement('div');fields.className='task-fields';fields.innerHTML='<div class="field-row"><label>Εργαζόμενος</label><input class="employee" placeholder="Όνομα"></div><div class="field-row"><label>Χρόνος (λεπτά)</label><input class="time-wheel" type="number" min="0" placeholder="0"></div><div class="field-row note-field"><label>Σημειώσεις</label><textarea class="note" placeholder="Προσθέστε σημειώσεις..."></textarea></div>';wrapper.appendChild(header);wrapper.appendChild(fields);root.appendChild(wrapper);refs.push({wrapper,checkbox,name})}}
function update(){let done=0;refs.forEach(r=>{const checked=r.checkbox.checked;const excluded=r.wrapper.classList.contains('excluded');const s=r.wrapper.querySelector('.status');if(excluded){s.textContent='Εξαιρέθηκε';s.className='status excluded'}else if(checked){s.textContent='Ολοκληρώθηκε';s.className='status complete';done++}else{s.textContent='Εκκρεμές';s.className='status pending'}});const total=refs.filter(r=>!r.wrapper.classList.contains('excluded')).length;document.getElementById('fill').style.width=(total>0?done/total*100:0)+'%'}
function formData(){return {customerName:document.getElementById('customerName').value,vehicleMake:document.getElementById('vehicleMake').value,vehicleModel:document.getElementById('vehicleModel').value,licensePlate:document.getElementById('licensePlate').value,serviceDate:document.getElementById('serviceDate').value,approvedBy:document.getElementById('approvedBy').value,tasks:refs.map(r=>({task:r.name,completed:r.checkbox.checked,excluded:r.wrapper.classList.contains('excluded'),employee:r.wrapper.querySelector('.employee').value,timeMinutes:r.wrapper.querySelector('.time-wheel').value,note:r.wrapper.querySelector('.note').value}))}}
function saveLocal(){localStorage.setItem('hyperwashData',JSON.stringify(formData()));alert('Αποθηκεύτηκε με επιτυχία.')}
function load(){const d=JSON.parse(localStorage.getItem('hyperwashData')||'null');if(!d)return;document.getElementById('customerName').value=d.customerName||'';document.getElementById('vehicleMake').value=d.vehicleMake||'';document.getElementById('vehicleModel').value=d.vehicleModel||'';document.getElementById('licensePlate').value=d.licensePlate||'';document.getElementById('serviceDate').value=d.serviceDate||'';document.getElementById('approvedBy').value=d.approvedBy||'';(d.tasks||[]).forEach((t,i)=>{if(!refs[i])return;refs[i].checkbox.checked=!!t.completed;if(t.excluded){refs[i].wrapper.classList.add('excluded');refs[i].wrapper.querySelector('.not-included-btn').classList.add('active')}refs[i].wrapper.querySelector('.employee').value=t.employee||'';refs[i].wrapper.querySelector('.time-wheel').value=t.timeMinutes||'';refs[i].wrapper.querySelector('.note').value=t.note||''});update()}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportSheets(){const d=formData();let csv='Hyperwash Detailing - Φόρμα Ολοκλήρωσης Εργασιών\n\nΌνομα Πελάτη,Μάρκα,Μοντέλο,Αριθμός Πινακίδας,Ημερομηνία,Εγκρίθηκε Από\n'+[d.customerName,d.vehicleMake,d.vehicleModel,d.licensePlate,d.serviceDate,d.approvedBy].map(csvCell).join(',')+'\n\nErgasia,Katastasi,Ergazoмenos,Xronos (lepta),Simeioseis\n';d.tasks.forEach(t=>{const status=t.excluded?'Εξαιρέθηκε':t.completed?'Ολοκληρώθηκε':'Εκκρεμές';csv+=[t.task,status,t.employee,t.timeMinutes||'',t.note].map(csvCell).join(',')+'\n'});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Hyperwash-'+(d.serviceDate||new Date().toISOString().slice(0,10))+'.csv';a.click()}
function resetForm(){if(!confirm('Να διαγραφούν όλα τα δεδομένα;'))return;localStorage.removeItem('hyperwashData');document.querySelectorAll('input[type!="checkbox"]').forEach(i=>i.value='');document.querySelectorAll('input[type="checkbox"]').forEach(i=>i.checked=false);document.querySelectorAll('textarea').forEach(t=>t.value='');document.querySelectorAll('.task-wrapper').forEach(w=>w.classList.remove('excluded'));document.querySelectorAll('.not-included-btn').forEach(b=>b.classList.remove('active'));update()}load();update();
</script></body></html>
