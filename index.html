<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanCar - Auto Detailing Checklist</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group.full {
            grid-column: span 2;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        input[type='text'],
        input[type='date'] {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input[type='text']:focus,
        input[type='date']:focus {
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <header>
        <h1>🚗 CleanCar</h1>
        <p class="subtitle">Auto Detailing Checklist</p>
    </header>

    <div class="card">
        <div class="meta-grid">
            <div class="input-group">
                <label>Vehicle Make</label>
                <input type="text" placeholder="e.g., Toyota">
            </div>
            <div class="input-group">
                <label>Vehicle Model</label>
                <input type="text" placeholder="e.g., Camry">
            </div>
            <div class="input-group">
                <label>Service Date</label>
                <input type="date">
            </div>
            <div class="input-group">
                <label>Technician</label>
                <input type="text" placeholder="Name">
            </div>
            <div class="input-group full">
                <label>Notes</label>
                <input type="text" placeholder="Additional details...">
            </div>
        </div>
    </div>

    <div class="card">
        <h2 style="font-size: 1.1rem; margin-bottom: 12px;">Exterior Checklist</h2>
        <div style="display: grid; gap: 8px;">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox"> Wash & rinse
            </label>
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox"> Clay bar treatment
            </label>
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox"> Wax & polish
            </label>
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox"> Tire cleaning
            </label>
        </div>
    </div>

    <div class="card">
        <h2 style="font-size: 1.1rem; margin-bottom: 12px;">Interior Checklist</h2>
        <div style="display: grid; gap: 8px;">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox"> Vacuum seats & carpets
            </label>
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox"> Clean dashboard
            </label>
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox"> Wipe windows
            </label>
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox"> Air freshener
            </label>
        </div>
    </div>
</body>
</html>
