<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanCar — Employee Task Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#172033;--muted:#667085;--line:#e5e7eb;--bg:#f6f7f9;--blue:#315efb;--green:#159570;--amber:#a15c00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif;padding:28px 16px}.wrap{max-width:980px;margin:auto}header{margin:0 0 24px}h1{font-size:25px;margin:0 0 5px;letter-spacing:-.5px}header p{color:var(--muted);margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #1720330a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label,.colhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted)}input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-width:0}input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #315efb18}.progress{height:7px;background:#edf0f3;border-radius:99px;margin-top:18px;overflow:hidden}.fill{height:100%;background:var(--green);width:0;transition:.25s}.section{font-weight:700;font-size:16px;margin-bottom:12px}.columns,.task{display:grid;grid-template-columns:42px minmax(180px,1fr) 180px 145px 90px;gap:12px;align-items:center}.columns{padding:0 12px 8px}.task{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}.task:hover{background:#f5f7fa}.check{width:30px;height:30px;accent-color:var(--green);cursor:pointer}.name{font-weight:500}.task .field{gap:4px}.task .field label{display:none}.status{text-align:center;border-radius:6px;padding:6px 5px;font-size:11px;font-weight:700;text-transform:uppercase}.pending{background:#fff3d6;color:var(--amber)}.complete{background:#dff7ee;color:#087653}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{border:0;border-radius:8px;padding:11px 16px;font:600 13px Inter;cursor:pointer}.save{background:var(--ink);color:#fff}.reset{background:#fff;border:1px solid var(--line)!important;color:var(--ink)}.export{background:var(--green);color:#fff;flex:1;min-width:220px}.note{text-align:center;color:var(--muted);font-size:12px;margin:18px 0}.task.done .name{text-decoration:line-through;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.columns{display:none}.task{grid-template-columns:38px 1fr 100px}.task .field{grid-column:2 / span 2}.task .status{grid-column:3}.task .field label{display:block}.task .time-field{grid-column:2}.task .employee-field{grid-column:3}.check{width:28px;height:28px}}
@media(max-width:460px){.grid{grid-template-columns:1fr}.task{grid-template-columns:38px 1fr}.task .field,.task .status{grid-column:2}.actions{flex-direction:column}.actions button{width:100%}}
</style>
</head>
<body><main class="wrap">
<header><h1>CleanCar Task Tracker</h1><p>Internal employee task completion log</p></header>
<section class="card"><div class="grid">
<div class="field"><label>Vehicle Make</label><input id="vehicleMake" placeholder="e.g. Toyota"></div>
<div class="field"><label>Vehicle Model</label><input id="vehicleModel" placeholder="e.g. Camry"></div>
<div class="field"><label>Service Date</label><input id="serviceDate" type="date"></div>
<div class="field"><label>Approved By</label><input id="approvedBy" placeholder="Manager name"></div>
</div><div class="progress"><div class="fill" id="fill"></div></div></section>
<section class="card"><div class="columns"><span></span><span class="colhead">Task</span><span class="colhead">Employee</span><span class="colhead">Time Completed</span><span class="colhead">Status</span></div><div id="tasks"></div></section>
<div class="actions"><button class="save" onclick="saveLocal()">Save</button><button class="reset" onclick="resetForm()">Reset</button><button class="export" onclick="exportSheets()">Export to Google Sheets</button></div>
<p class="note">Data is saved only in this browser. Export downloads a CSV file ready to import into Google Sheets.</p>
</main>
<script>
const taskGroups={"Exterior & Paint":['Scratch removal','Polishing','Car waxing','Clay bar treatment','Κεραμικές επιστρώσεις'],"Interior & Detailing":['Vehicle interior vacuuming','Vacuuming','Auto detailing','Βιολογικοί καθαρισμοί','Καθορισμός αυτοκινήτου και μηχανής με ατμό'],"Additional Services":['Αφαίρεση επικαθησεων']};
const root=document.getElementById('tasks');let taskIndex=0;const refs=[];
for(const [group,names] of Object.entries(taskGroups)){const section=document.createElement('div');section.innerHTML='<div class="section">'+group+'</div>';for(const name of names){const row=document.createElement('div');row.className='task';row.innerHTML='<input class="check" type="checkbox"><div class="name"></div><div class="field employee-field"><label>Employee</label><input class="employee" placeholder="Name"></div><div class="field time-field"><label>Time Completed</label><input class="time" type="time"></div><div class="status pending">Pending</div>';row.querySelector('.name').textContent=name;row.querySelector('.check').dataset.task=name;row.querySelector('.check').addEventListener('change',update);section.appendChild(row);refs.push(row);taskIndex++}root.appendChild(section)}
function update(){let done=0;refs.forEach(r=>{const checked=r.querySelector('.check').checked;const s=r.querySelector('.status');r.classList.toggle('done',checked);s.textContent=checked?'Complete':'Pending';s.className='status '+(checked?'complete':'pending');if(checked)done++});document.getElementById('fill').style.width=(done/refs.length*100)+'%'}
function formData(){return {vehicleMake:vehicleMake.value,vehicleModel:vehicleModel.value,serviceDate:serviceDate.value,approvedBy:approvedBy.value,tasks:refs.map(r=>({task:r.querySelector('.check').dataset.task,completed:r.querySelector('.check').checked,employee:r.querySelector('.employee').value,time:r.querySelector('.time').value}))}}
function saveLocal(){localStorage.setItem('cleancarData',JSON.stringify(formData()));alert('Saved successfully.')}
function load(){const d=JSON.parse(localStorage.getItem('cleancarData')||'null');if(!d)return;vehicleMake.value=d.vehicleMake||'';vehicleModel.value=d.vehicleModel||'';serviceDate.value=d.serviceDate||'';approvedBy.value=d.approvedBy||'';(d.tasks||[]).forEach((t,i)=>{if(!refs[i])return;refs[i].querySelector('.check').checked=!!t.completed;refs[i].querySelector('.employee').value=t.employee||'';refs[i].querySelector('.time').value=t.time||''});update()}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportSheets(){const d=formData();let csv='CleanCar Task Completion Log\n\nVehicle Make,Vehicle Model,Service Date,Approved By\n'+[d.vehicleMake,d.vehicleModel,d.serviceDate,d.approvedBy].map(csvCell).join(',')+'\n\nTask,Status,Employee,Time Completed\n';d.tasks.forEach(t=>csv+=[t.task,t.completed?'YES':'NO',t.employee,t.time].map(csvCell).join(',')+'\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='CleanCar-'+(d.serviceDate||new Date().toISOString().slice(0,10))+'.csv';a.click()}
function resetForm(){if(!confirm('Clear all checklist data?'))return;localStorage.removeItem('cleancarData');document.querySelectorAll('input').forEach(i=>{if(i.type==='checkbox')i.checked=false;else i.value=''});update()}load();update();
</script></body></html>
